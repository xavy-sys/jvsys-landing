<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVSys | Desarrollo de Apps SaaS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a1f3c, #0c2d5a);
      color: white;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px;
    }

    .text {
      max-width: 50%;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 span {
      color: #3db2ff;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
      color: #cfd8e3;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      padding: 12px 24px;
      margin-right: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background-color: #1e88ff;
      color: white;
    }

    .secondary {
      border: 1px solid #1e88ff;
      color: #1e88ff;
    }

    .image img {
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0px 10px 40px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="text">
      <h1>
        Desarrollamos Apps SaaS <br>
        <span>Audit-Proof</span>
      </h1>

      <p>
        Aplicaciones profesionales, seguras y trazables para administrar,
        operar y hacer crecer tu organización con información clara,
        evidencia confiable y procesos listos para auditoría.
      </p>

      <div class="buttons">
        <a href="#" class="btn primary">Solicitar informes</a>
        <a href="#" class="btn secondary">Conocer proyectos</a>
      </div>
    </div>

    <div class="image">
      <img src="mockup-condo-admin-saas.jpg" alt="Dashboard Condo Admin SaaS">
    </div>

  </div>

</body>
</html>
